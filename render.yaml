services:
  # 1. Eureka Server
  - type: web
    name: eureka-server
    env: docker
    dockerContext: ./eureka
    dockerfilePath: ./eureka/Dockerfile
    plan: free
    envVars:
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"
      - key: PORT
        value: "8761"

  # 2. Config Server
  - type: web
    name: config-server
    env: docker
    dockerContext: ./configServer
    dockerfilePath: ./configServer/Dockerfile
    plan: free
    envVars:
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
        value: "classpath:/config"
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"
      - key: PORT
        value: "8888"

  # 3. User Service
  - type: web
    name: user-service
    env: docker
    dockerContext: ./userservice
    dockerfilePath: ./userservice/Dockerfile
    plan: free
    envVars:
      - key: SPRING_CONFIG_IMPORT
        value: optional:configserver:http://config-server:8888
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: SPRING_DATASOURCE_URL
        sync: false # Set your DB URL in Render dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"
      - key: PORT
        value: "8081"

  # 4. Activity Service
  - type: web
    name: activity-service
    env: docker
    dockerContext: .
    dockerfilePath: activityservice/Dockerfile
    plan: free
    envVars:
      - key: SPRING_CONFIG_IMPORT
        value: optional:configserver:http://config-server:8888
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: SPRING_DATA_MONGODB_URI
        sync: false # Set your MongoDB Atlas URI in Render dashboard
      - key: SPRING_RABBITMQ_HOST
        sync: false # Set your CloudAMQP host in Render dashboard
      - key: SPRING_RABBITMQ_PORT
        value: "5672"
      - key: SPRING_RABBITMQ_USERNAME
        sync: false
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"
      - key: PORT
        value: "8082"

  # 5. AI Service
  - type: web
    name: ai-service
    env: docker
    dockerContext: .
    dockerfilePath: aiservice/Dockerfile
    plan: free
    envVars:
      - key: SPRING_CONFIG_IMPORT
        value: optional:configserver:http://config-server:8888
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: GROQ_API_KEY
        sync: false
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: SPRING_RABBITMQ_HOST
        sync: false
      - key: SPRING_RABBITMQ_PORT
        value: "5672"
      - key: SPRING_RABBITMQ_USERNAME
        sync: false
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"
      - key: PORT
        value: "8083"
  # 6. API Gateway
  - type: web
    name: api-gateway
    env: docker
    dockerContext: ./gateway
    dockerfilePath: ./gateway/Dockerfile
    plan: free
    envVars:
      - key: SPRING_CONFIG_IMPORT
        value: optional:configserver:http://config-server:8888
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: FRONTEND_URL
        fromService:
          name: fitness-frontend
          type: web
          property: host
      - key: JWK_SET_URI
        sync: false # Set this to your production Keycloak URL in Render dashboard
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"
      - key: PORT
        value: "8080"

  # 7. Frontend
  - type: web
    name: fitness-frontend
    env: docker
    dockerContext: ./fitness-app-frontend
    dockerfilePath: ./fitness-app-frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: api-gateway
          type: web
          property: host
